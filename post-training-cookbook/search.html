<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全书检索 | 大模型后训练实战 Cookbook</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/manifest.js"></script>
<script src="assets/js/search-index.js"></script>
<script src="assets/js/nav.js" defer></script>
<style>
.search-hero {
  background: linear-gradient(135deg, #0b1220 0%, #1e3a8a 100%);
  color: #fff;
  border-radius: 16px;
  padding: 36px 32px;
  margin-bottom: 28px;
}
.search-hero h1 { color: #fff; margin: 0 0 12px; font-size: 28px; }
.search-hero p { color: #cbd5e1; margin: 0 0 20px; font-size: 15px; }
.search-input-wrap {
  display: flex;
  gap: 10px;
}
.search-input-wrap input {
  flex: 1;
  padding: 12px 18px;
  border-radius: 10px;
  border: 1px solid #334155;
  background: #0f172a;
  color: #fff;
  font-size: 16px;
  outline: none;
}
.search-input-wrap input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
}
.search-input-wrap button {
  padding: 12px 24px;
  border-radius: 10px;
  border: none;
  background: #2563eb;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
}
.search-input-wrap button:hover { background: #1d4ed8; }
.search-stats { font-size: 14px; color: #64748b; margin-bottom: 20px; }
.result-item {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 16px;
  transition: box-shadow .2s, transform .2s;
}
.result-item:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,.06);
  transform: translateY(-2px);
}
.result-item h3 { margin: 0 0 8px; font-size: 18px; }
.result-item h3 a { color: #1e3a8a; text-decoration: none; }
.result-item h3 a:hover { color: #2563eb; text-decoration: underline; }
.result-headings { margin: 6px 0 10px; font-size: 13px; color: #64748b; }
.result-tag {
  display: inline-block;
  background: #f1f5f9;
  color: #475569;
  padding: 2px 8px;
  border-radius: 6px;
  margin: 2px 4px 2px 0;
}
.result-summary { font-size: 14.5px; color: #334155; line-height: 1.6; }
.highlight { background: #fef08a; padding: 0 2px; border-radius: 2px; font-weight: bold; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    
    <div class="search-hero">
      <h1>🔍 全书技术检索</h1>
      <p>在全书 65 个章节、数万个知识点中实时全文查找：算法推导、超参配置、工业代码、实战项目与论文导读。</p>
      <div class="search-input-wrap">
        <input id="main-search-input" type="text" placeholder="输入关键词（如：GRPO, DPO, LoRA, 显存估算, PagedAttention, 灾难性遗忘...）" autofocus>
        <button id="search-btn">搜索</button>
      </div>
    </div>

    <div class="search-stats" id="search-stats">输入关键词开始检索...</div>
    <div id="search-results"></div>

    <footer class="chapter-footer"></footer>
  </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var input = document.getElementById('main-search-input');
  var btn = document.getElementById('search-btn');
  var stats = document.getElementById('search-stats');
  var container = document.getElementById('search-results');
  var index = window.COOKBOOK_SEARCH_INDEX || [];

  function doSearch() {
    var q = input.value.trim().toLowerCase();
    if (!q) {
      stats.textContent = '请输入搜索关键词';
      container.innerHTML = '';
      return;
    }

    var words = q.split(/\s+/).filter(Boolean);
    var results = [];

    index.forEach(function(item) {
      var score = 0;
      var text = (item.title + ' ' + item.headings.join(' ') + ' ' + item.summary).toLowerCase();
      
      words.forEach(function(w) {
        if (item.title.toLowerCase().indexOf(w) !== -1) score += 10;
        item.headings.forEach(function(h) {
          if (h.toLowerCase().indexOf(w) !== -1) score += 5;
        });
        if (item.summary.toLowerCase().indexOf(w) !== -1) score += 2;
      });

      if (score > 0) {
        results.push({ item: item, score: score });
      }
    });

    results.sort(function(a, b) { return b.score - a.score; });

    stats.textContent = '找到 ' + results.length + ' 个相关章节';
    
    if (results.length === 0) {
      container.innerHTML = '<div class="callout note"><div class="callout-title">💡 未找到匹配内容</div><p>建议更换关键词或尝试英文缩写（例如将“直接偏好优化”换为“DPO”）。</p></div>';
      return;
    }

    var html = '';
    results.forEach(function(r) {
      var it = r.item;
      html += '<div class="result-item">';
      html += '<h3><a href="' + it.file + '">' + it.title + '</a></h3>';
      if (it.headings && it.headings.length > 0) {
        html += '<div class="result-headings">包含章节：';
        it.headings.slice(0, 5).forEach(function(h) {
          html += '<span class="result-tag">' + h + '</span>';
        });
        if (it.headings.length > 5) html += '<span class="result-tag">+' + (it.headings.length - 5) + ' 个小节</span>';
        html += '</div>';
      }
      html += '<div class="result-summary">' + it.summary + '</div>';
      html += '</div>';
    });
    container.innerHTML = html;
  }

  btn.addEventListener('click', doSearch);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSearch();
  });

  // URL 参数自动填充
  var urlParams = new URLSearchParams(window.location.search);
  var initialQuery = urlParams.get('q');
  if (initialQuery) {
    input.value = initialQuery;
    doSearch();
  }
});
</script>
</body>
</html>
