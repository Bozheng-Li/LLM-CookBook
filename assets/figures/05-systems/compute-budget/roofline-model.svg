<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Roofline 性能模型</title>
  <desc id="desc">横轴是算术强度，纵轴是可达性能。带宽上限为向上倾斜线，峰值算力为水平线，两线交点是机器平衡点。</desc>
  <rect width="760" height="460" fill="#ffffff"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#1a1d24">
    <line x1="86" y1="378" x2="710" y2="378" stroke="#4a5160" stroke-width="2"/>
    <line x1="86" y1="378" x2="86" y2="48" stroke="#4a5160" stroke-width="2"/>
    <path d="M696 370 L710 378 L696 386" fill="none" stroke="#4a5160" stroke-width="2"/>
    <path d="M78 62 L86 48 L94 62" fill="none" stroke="#4a5160" stroke-width="2"/>
    <text x="400" y="430" text-anchor="middle" font-size="20">算术强度（FLOP / Byte，对数刻度）</text>
    <text x="28" y="218" text-anchor="middle" font-size="20" transform="rotate(-90 28 218)">可达性能（FLOP / s）</text>
    <line x1="106" y1="352" x2="438" y2="104" stroke="#185fa5" stroke-width="7" stroke-linecap="round"/>
    <line x1="438" y1="104" x2="690" y2="104" stroke="#a32d2d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="438" cy="104" r="8" fill="#1a1d24"/>
    <line x1="438" y1="104" x2="438" y2="378" stroke="#858c9a" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="456" y="92" font-size="18" font-weight="700" fill="#a32d2d">峰值算力上限</text>
    <text x="172" y="286" font-size="18" font-weight="700" fill="#185fa5" transform="rotate(-37 172 286)">内存带宽上限</text>
    <text x="438" y="407" text-anchor="middle" font-size="16">机器平衡点</text>
    <circle cx="248" cy="248" r="9" fill="#3b6d11"/>
    <text x="176" y="224" font-size="17" fill="#3b6d11">带宽受限算子</text>
    <circle cx="588" cy="104" r="9" fill="#854f0b"/>
    <text x="544" y="76" font-size="17" fill="#854f0b">算力受限算子</text>
    <text x="128" y="344" font-size="15" fill="#4a5160">融合、tiling、减少访存</text>
    <text x="515" y="145" font-size="15" fill="#4a5160">更高算力或更低精度</text>
  </g>
</svg>
