<text x="210.0" y="274.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">每次调用从零开始，没有记忆</text>
<rect x="602" y="236" width="296" height="50" rx="10" fill="#eef0fd" stroke="#4f46e5" stroke-width="1.4"/>
<text x="750.0" y="254.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#3730a3" font-weight="700" text-anchor="middle" style="">记忆系统</text>
<text x="750.0" y="274.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">短期上下文 + 长期持久化存储</text>
<marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#7a7d8c"/></marker>
<line x1="362" y1="261" x2="596" y2="261" stroke="#7a7d8c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m3)"/>
<rect x="62" y="296" width="296" height="50" rx="10" fill="#fdf3e3" stroke="#d97706" stroke-width="1.4"/>
<text x="210.0" y="314.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#92400e" font-weight="700" text-anchor="middle" style="">无行动能力</text>
<text x="210.0" y="334.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">只会生成文本，不能感知与执行</text>
<rect x="602" y="296" width="296" height="50" rx="10" fill="#eef0fd" stroke="#4f46e5" stroke-width="1.4"/>
<text x="750.0" y="314.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#3730a3" font-weight="700" text-anchor="middle" style="">规划 - 执行 - 反思</text>
<text x="750.0" y="334.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">任务分解、中间结果验证、重试</text>
<marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#7a7d8c"/></marker>
<line x1="362" y1="321" x2="596" y2="321" stroke="#7a7d8c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m4)"/>
<text x="480" y="392" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#4a4d5a" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">Agent 不是让概率大脑变得更聪明，而是给它接上外部世界与纠错回路 —— 能力边界决定系统架构</text></svg>