<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><defs></defs><rect width="960" height="430" fill="#ffffff"/><text x="480" y="32" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="18" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">为什么需要 Agent：四堵墙与四根支柱</text>
<text x="480" y="56" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">裸 LLM 的每一条边界，恰好对应 Agent 架构要补上的一种机制</text>
<rect x="40" y="78" width="340" height="282" rx="12" fill="#ffffff" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="54" y="98" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#4a4d5a" font-weight="700" text-anchor="start" style="">裸 LLM 的四堵墙</text>
<rect x="580" y="78" width="340" height="282" rx="12" fill="#ffffff" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="594" y="98" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#4a4d5a" font-weight="700" text-anchor="start" style="">Agent 的四根支柱</text>
<rect x="62" y="116" width="296" height="50" rx="10" fill="#fdeeee" stroke="#dc2626" stroke-width="1.4"/>
<text x="210.0" y="134.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#991b1b" font-weight="700" text-anchor="middle" style="">知识截止</text>
<text x="210.0" y="154.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">训练数据之后的世界一无所知</text>
<rect x="602" y="116" width="296" height="50" rx="10" fill="#e7f6f4" stroke="#0d9488" stroke-width="1.4"/>
<text x="750.0" y="134.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#115e59" font-weight="700" text-anchor="middle" style="">检索接地（RAG / 搜索）</text>
<text x="750.0" y="154.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">把时效事实注入上下文再作答</text>
<marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#7a7d8c"/></marker>
<line x1="362" y1="141" x2="596" y2="141" stroke="#7a7d8c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m1)"/>
<rect x="62" y="176" width="296" height="50" rx="10" fill="#fdeeee" stroke="#dc2626" stroke-width="1.4"/>
<text x="210.0" y="194.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#991b1b" font-weight="700" text-anchor="middle" style="">幻觉与过度自信</text>
<text x="210.0" y="214.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">流畅优先于真实，置信度失真</text>
<rect x="602" y="176" width="296" height="50" rx="10" fill="#e7f6f4" stroke="#0d9488" stroke-width="1.4"/>
<text x="750.0" y="194.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#115e59" font-weight="700" text-anchor="middle" style="">工具调用 + 结果校验</text>
<text x="750.0" y="214.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">计算器、代码执行、API 交叉核实</text>
<marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#7a7d8c"/></marker>
<line x1="362" y1="201" x2="596" y2="201" stroke="#7a7d8c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m2)"/>
