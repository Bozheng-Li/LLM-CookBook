<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430"><defs></defs><rect width="920" height="430" fill="#ffffff"/><text x="460" y="32" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">KV Cache:用显存换时间的『增量生成』</text>
<rect x="50" y="58" width="410" height="170" rx="12" fill="#ffffff" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="64" y="78" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#991b1b" font-weight="700" text-anchor="start" style="">无缓存:每生成 1 个 Token,历史全部重算</text>
<text x="72" y="113" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="600" text-anchor="start" style="">调用 1</text>
<rect x="138" y="100" width="70" height="18" rx="5" fill="#dc2626" opacity="0.75"/>
<text x="218" y="114" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="600" text-anchor="start" style="">算 T1</text>
<text x="72" y="153" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="600" text-anchor="start" style="">调用 2</text>
<rect x="138" y="140" width="140" height="18" rx="5" fill="#dc2626" opacity="0.75"/>
<text x="288" y="154" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="600" text-anchor="start" style="">算 T1 T2</text>
<text x="72" y="193" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="600" text-anchor="start" style="">调用 3</text>
<rect x="138" y="180" width="210" height="18" rx="5" fill="#dc2626" opacity="0.75"/>
<text x="358" y="194" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="600" text-anchor="start" style="">算 T1 T2 T3</text>
<text x="255" y="218" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#991b1b" font-weight="700" text-anchor="middle" style="">前缀被一遍遍重复计算 → 浪费</text>
<rect x="50" y="246" width="410" height="152" rx="12" fill="#ffffff" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="64" y="266" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#115e59" font-weight="700" text-anchor="start" style="">有 KV Cache:历史的 K/V 存显存,只算新 Token</text>
<text x="72" y="301" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="600" text-anchor="start" style="">调用 2</text>
<rect x="138" y="288" width="44" height="18" rx="5" fill="#16a34a" opacity="0.8"/>
<text x="192" y="302" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="600" text-anchor="start" style="">只算 T2 · 复用 K1</text>
<text x="72" y="341" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="600" text-anchor="start" style="">调用 3</text>
<rect x="138" y="328" width="44" height="18" rx="5" fill="#16a34a" opacity="0.8"/>
<text x="192" y="342" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="600" text-anchor="start" style="">只算 T3 · 复用 K1 K2</text>
<rect x="230" y="352" width="200" height="40" rx="8" fill="#e7f6f4" stroke="#0d9488"/>
<text x="330" y="376" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#115e59" font-weight="700" text-anchor="middle" style="">缓存: K1 K2 的 K/V</text>
<rect x="500" y="58" width="380" height="340" rx="12" fill="#ffffff" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="514" y="78" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">代价与启示</text>
<text x="522" y="100.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">• 显存 ≈ 0.5 MB / Token(7B 模型</text>
<text x="522" y="119.4" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">  FP16,量级),随模型规模线性涨</text>
<text x="522" y="138.9" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">• 32K 上下文 ≈ 16 GB;200K ≈</text>
<text x="522" y="158.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">  100 GB → 必须多卡 / 量化 / GQA</text>
<text x="522" y="177.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">• prefill:一次性算完输入的 K/V,</text>
<text x="522" y="197.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">  可并行,受算力限制</text>
<text x="522" y="216.6" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">• decode:逐 Token 生成,受显存</text>
<text x="522" y="236.1" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">  带宽限制(访存瓶颈)</text>
<text x="522" y="255.5" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">• API 本质无状态 → 多轮对话每轮</text>
<text x="522" y="275.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">  重发全部历史,成本随轮次加速</text>
<text x="522" y="294.4" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">• Prompt Caching = 服务端替你</text>
<text x="522" y="313.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">  缓存 K/V,命中部分给折扣</text>
<text x="460" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">这就是 Agent 多轮循环成本随步数加速上涨的技术根源 —— 也是第 5 章『Token 经济学』的底层机制</text></svg>