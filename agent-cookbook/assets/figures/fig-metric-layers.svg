<text x="654" y="80" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">好指标的四个性质</text>
<text x="656" y="92" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.8" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">· 与业务成功对齐，而非代理指标</text>
<text x="656" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.8" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">· 可分层：端到端成功率 × 分项</text>
<text x="656" y="132" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.8" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">· 可复现：同输入同分数</text>
<text x="656" y="152" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.8" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">· 对改动敏感：能区分好坏版本</text>
<text x="480" y="408" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">代码与抽取任务从第一层开始就够；开放式生成任务才需要第二、三层——先问「这个任务的可验证面有多大」</text></svg>