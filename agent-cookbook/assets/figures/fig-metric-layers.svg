<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><defs></defs><rect width="960" height="430" fill="#ffffff"/><text x="480" y="30" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">给质量打分的三层指标：成本换覆盖</text>
<text x="480" y="52" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">规则指标客观但窄，人工评审准但贵，模型裁判居中——生产系统三层并用、互相校准</text>
<rect x="50" y="84" width="220" height="84" rx="10" fill="#e7f6f4" stroke="#0d9488" stroke-width="1.4"/>
