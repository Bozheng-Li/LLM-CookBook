<text x="160.0" y="338.4" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#5b21b6" font-weight="700" text-anchor="middle" style="">第三层 · 人工评审</text>
<text x="300" y="318" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">· 每版本抽 30~100 条</text>
<text x="300" y="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">· 双人标注 + 分歧仲裁</text>
<text x="300" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">· 定期抽检校准裁判指标</text>
<text x="640" y="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#5b21b6" font-weight="600" text-anchor="start" style="">金标准 · 贵 · 用于给前两层「定标」</text>
