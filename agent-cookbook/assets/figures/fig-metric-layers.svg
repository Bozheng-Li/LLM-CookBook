<text x="300" y="110" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">· 精确匹配 / 通过单元测试</text>
<text x="300" y="132" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">· JSON Schema 校验、引用命中</text>
<text x="300" y="154" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">· 字段级 F1（抽取任务）</text>
<text x="640" y="132" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#115e59" font-weight="600" text-anchor="start" style="">成本 ≈ 0 · 客观可复现 · 只覆盖可形式化的子集</text>
