<text x="300" y="214" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">· 按 rubric 打 1~5 分</text>
<text x="300" y="236" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">· pairwise 对比新旧版本</text>
<text x="300" y="258" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">· 要点清单核对（引用覆盖率）</text>
<text x="640" y="236" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#3730a3" font-weight="600" text-anchor="start" style="">成本中等 · 覆盖广 · 有位置/长度/自我偏好偏差</text>
