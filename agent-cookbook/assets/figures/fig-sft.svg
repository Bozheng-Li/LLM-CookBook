<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"><defs></defs><rect width="900" height="380" fill="#ffffff"/><text x="450" y="30" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">SFT:用『示范』教模型做事</text>
<rect x="50" y="60" width="380" height="240" rx="12" fill="#fafaf7" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="64" y="80" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">数据构造(质量 &gt; 数量)</text>
<text x="70" y="98.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="start" style="">{&quot;messages&quot;: [</text>
<text x="70" y="114.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="start" style="">  {&quot;role&quot;:&quot;system&quot;,&quot;content&quot;:&quot;你是工具助手&quot;},</text>
<text x="70" y="130.6" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="start" style="">  {&quot;role&quot;:&quot;user&quot;,&quot;content&quot;:&quot;北京天气如何?&quot;},</text>
<text x="70" y="146.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="start" style="">  {&quot;role&quot;:&quot;assistant&quot;,&quot;tool_calls&quot;:[get_weather]},</text>
<text x="70" y="163.1" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="start" style="">  {&quot;role&quot;:&quot;tool&quot;,&quot;content&quot;:&quot;{temp:25}&quot;},</text>
<text x="70" y="179.4" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="start" style="">  {&quot;role&quot;:&quot;assistant&quot;,&quot;content&quot;:&quot;北京今天25°C,晴&quot;}</text>
<text x="70" y="195.7" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="start" style="">]}</text>
<rect x="470" y="60" width="380" height="240" rx="12" fill="#fafaf7" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="484" y="80" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">训练要点</text>
<text x="490" y="98.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">• Chat Template 必须与推理时一致</text>
<text x="490" y="119.6" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">• 只对 assistant 段计算 loss(掩码)</text>
<text x="490" y="141.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">• LoRA: r=16~64, 只训 0.1~1% 参数</text>
<text x="490" y="162.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">• 学习率 1e-4(全参) / 2e-4(LoRA)</text>
<text x="490" y="184.4" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">• 2~3 epoch,小心过拟合到『话术』</text>
<rect x="219.33999999999997" y="318.0" width="461.32000000000005" height="24" rx="12.0" fill="#fdf3e3" stroke="none"/>
<text x="450" y="334.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#92400e" font-weight="700" text-anchor="middle" style="">SFT 教会『模仿』而非『判断』—— 模型学会好答案长什么样,但不知道自己错没错</text>
<text x="450" y="362" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">这就是为什么 SFT 之后还需要 RL(第 40-43 章):从模仿走向优化</text></svg>