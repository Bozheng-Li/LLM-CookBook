<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400"><defs></defs><rect width="940" height="400" fill="#ffffff"/><text x="470" y="32" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="18" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">Confused Deputy:有权限的代理人被无权限者指挥</text>
<rect x="60" y="120" width="160" height="100" rx="10" fill="#fdeeee" stroke="#dc2626" stroke-width="1.4"/>
<text x="140.0" y="162.9" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">攻击者</text>
<text x="140.0" y="183.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">写入恶意网页</text>
<rect x="280" y="120" width="150" height="100" rx="10" fill="#fdf3e3" stroke="#d97706" stroke-width="1.4"/>
<text x="355.0" y="162.9" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">资源</text>
<text x="355.0" y="183.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">用户的数据
(攻击者无权访问)</text>
<rect x="510" y="120" width="160" height="100" rx="10" fill="#eef0fd" stroke="#4f46e5" stroke-width="1.4"/>
<text x="590.0" y="162.9" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">Agent(代理)</text>
<text x="590.0" y="183.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">持有全部权限
被注入指令操纵</text>
<rect x="760" y="120" width="130" height="100" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="825.0" y="162.9" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">受害者</text>
<text x="825.0" y="183.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">数据被外泄</text>
<marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#dc2626"/></marker>
<line x1="220" y1="160" x2="280" y2="160" stroke="#dc2626" stroke-width="1.8" marker-end="url(#m1)"/>
<text x="250.0" y="152.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#dc2626" font-weight="600" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;">投毒</text>
<marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#4a4d5a"/></marker>
<line x1="430" y1="185" x2="510" y2="185" stroke="#4a4d5a" stroke-width="1.8" marker-end="url(#m2)"/>
<text x="470.0" y="177.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="600" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;">Agent 读取</text>
<marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#dc2626"/></marker>
<line x1="670" y1="160" x2="760" y2="160" stroke="#dc2626" stroke-width="1.8" marker-end="url(#m3)"/>
<text x="715.0" y="152.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#dc2626" font-weight="600" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;">外泄</text>
<text x="70" y="270" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">关键缺陷: Agent 的权限 ≠ 用户的权限 — 代理合并了「读资源」与「听指挥」两个能力,</text>
<text x="70" y="294" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">而这两个能力的授权者不同(资源属于用户, 指挥可能来自任何数据源)。</text>
<text x="70" y="326" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#3730a3" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">解法方向: ① 权限跟随数据来源(源自不可信域的指令降权) ② 高危动作需「用户来源」的指令 ③ 出站过滤</text></svg>