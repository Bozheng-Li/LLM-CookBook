<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380"><defs></defs><rect width="940" height="380" fill="#ffffff"/><text x="470" y="32" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="18" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">滥用者画像与分级响应金字塔</text>
<rect x="60" y="260" width="820" height="80" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/>
<text x="470.0" y="305" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">好奇型 (大多数): 玩家试探边界 — 宽松响应: 拒答+幽默+引导</text>
<rect x="60" y="170" width="820" height="80" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
<text x="470.0" y="215" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">机会型: 找免费劳动力/绕过付费 — 标准响应: 拒答+频控+记录</text>
<rect x="60" y="80" width="820" height="80" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<text x="470.0" y="125" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">对抗型: 有组织的攻击/滥用牟利 — 强响应: 封禁+法务+情报共享</text>
<text x="470" y="30" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">金字塔底宽顶尖: 好奇型占 90%+ — 对「大众」用重手段会误伤体验, 对「尖顶」用轻手段会纵容攻击</text></svg>