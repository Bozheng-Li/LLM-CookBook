<text x="450" y="300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">Handoff = 把『当前对话与状态』整体移交给另一个 Agent,原 Agent 退出 —— 简单清晰的权责转移</text>
<text x="450" y="330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">配套:Sessions(自动历史)、Tracing(自带面板)、Guardrails(并行校验)</text></svg>