<rect x="46" y="350" width="894" height="116" rx="12" fill="#fdf3e3" stroke="#d97706" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="60" y="370" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">两个工程推论</text>
<text x="70" y="386" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="600" text-anchor="start" style="">① 成本随步数超线性增长：第 n 轮要为前 n-1 轮的全部上下文再付一次输入 token 的钱——循环的账单是平方量级的</text>
<text x="70" y="410" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="600" text-anchor="start" style="">② 状态 = 某一时刻的 messages：把它序列化存盘即「检查点」；载入后接着跑即「恢复」——暂停、审批、断点续跑全靠它</text>
<text x="70" y="440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">工具结果过大时先裁剪再回填（上下文预算见第 23 章）；已被回答的旧观察可以压缩成一行摘要，为后续步骤腾地方。</text></svg>