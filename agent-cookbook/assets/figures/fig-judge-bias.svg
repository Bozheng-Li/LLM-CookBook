<text x="470.0" y="120" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">偏好更长的回答</text>
