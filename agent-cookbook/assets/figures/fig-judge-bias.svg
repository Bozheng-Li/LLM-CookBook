<text x="470.0" y="202" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#3730a3" font-weight="400" text-anchor="middle" style="">校正: 长度分层比较</text>
<text x="470.0" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#3730a3" font-weight="400" text-anchor="middle" style="">+ 长度惩罚项</text>
<rect x="620" y="80" width="260" height="200" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="750.0" y="184.6" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">自我偏好</text>
<text x="750.0" y="120" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">偏好自己的风格/输出</text>
<text x="750.0" y="138" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">(同源模型的偏爱)</text>
<text x="750.0" y="180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7c3aed" font-weight="800" text-anchor="middle" style="">校正:</text>
<text x="750.0" y="202" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#3730a3" font-weight="400" text-anchor="middle" style="">校正: 异源裁判</text>
<text x="750.0" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#3730a3" font-weight="400" text-anchor="middle" style="">(不同家族的模型)</text>
<text x="470" y="320" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#1c1e26" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">偏差检测的通用方法: 换位/换序/换裁判后重评 — 前后一致性低于 80% 即偏差存在, 需启用对应校正</text>
<text x="470" y="348" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#3730a3" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">底线认知: Judge 是「有偏差的测量仪器」— 校正能让它可用, 但永远别把它当真值</text></svg>