<text x="190.0" y="220" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#3730a3" font-weight="400" text-anchor="middle" style="">取一致或均值</text>
