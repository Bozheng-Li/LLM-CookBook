<svg xmlns="http://www.w3.org/2000/svg" width="920" height="310" viewBox="0 0 920 310"><defs></defs><rect width="920" height="310" fill="#ffffff"/><text x="460" y="32" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">BPE:高频字符对不断合并,直到词表用尽</text>
<rect x="50" y="66" width="240" height="168" rx="12" fill="#ffffff" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="64" y="86" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">① 初始:按字符切</text>
<text x="170" y="122" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#1c1e26" font-weight="600" text-anchor="middle" style="">u n b e l i e v</text>
<text x="170" y="142" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#1c1e26" font-weight="600" text-anchor="middle" style="">a b l e</text>
<text x="170" y="178.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="middle" style="">每个字符都是</text>
<text x="170" y="196.4" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="middle" style="">独立 Token</text>
<text x="170" y="214.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="middle" style="">词表从 26 个字母起步</text>
<rect x="340" y="66" width="240" height="168" rx="12" fill="#ffffff" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="354" y="86" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">② 统计相邻对频率</text>
<text x="460" y="108.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="middle" style="">『li』出现 12000 次 → 合并</text>
<text x="460" y="128.1" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="middle" style="">『ab』出现 11000 次 → 合并</text>
<text x="460" y="148.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="middle" style="">『un』『able』… 依次合并</text>
<text x="460" y="168.4" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="middle" style="">循环:重新统计 → 再合并</text>
<text x="460" y="188.5" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="middle" style="">直到达到词表大小上限</text>
<rect x="630" y="66" width="240" height="168" rx="12" fill="#ffffff" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="644" y="86" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">③ 收敛:子词词表</text>
<text x="750" y="122" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#115e59" font-weight="700" text-anchor="middle" style="">un | believ | able</text>
<text x="750" y="158.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="middle" style="">13 个字符 → 3 个 Token</text>
<text x="750" y="178.1" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="middle" style="">常见词整存,罕见词拆开</text>
<text x="750" y="198.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="middle" style="">词表 5 万~20 万(量级)</text>
<marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#7a7d8c"/></marker>
<line x1="292" y1="150" x2="336" y2="150" stroke="#7a7d8c" stroke-width="1.6" marker-end="url(#m1)"/>
<marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#7a7d8c"/></marker>
<line x1="582" y1="150" x2="626" y2="150" stroke="#7a7d8c" stroke-width="1.6" marker-end="url(#m2)"/>
<text x="460" y="276" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">任意新词都能一路拆到字符级 —— 这是 BPE 词表『没有未知词』的原因;各厂商词表互不通用,Token 数不能跨模型比较</text></svg>