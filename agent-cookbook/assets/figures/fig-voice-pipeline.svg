<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430"><defs></defs><rect width="940" height="430" fill="#ffffff"/><text x="470" y="32" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="18" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">语音 Agent 两条路线:级联管线 vs 端到端</text>
<rect x="40" y="70" width="420" height="250" rx="12" fill="#fafaf7" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="54" y="90" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">级联管线 (Pipeline)</text>
<rect x="60" y="120" width="110" height="60" rx="10" fill="#e7f6f4" stroke="#0d9488" stroke-width="1.4"/>
<text x="115.0" y="153.9" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">ASR</text>
<rect x="195" y="120" width="110" height="60" rx="10" fill="#eef0fd" stroke="#4f46e5" stroke-width="1.4"/>
<text x="250.0" y="153.9" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">LLM</text>
<rect x="330" y="120" width="110" height="60" rx="10" fill="#fdf3e3" stroke="#d97706" stroke-width="1.4"/>
<text x="385.0" y="153.9" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">TTS</text>
<marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#4a4d5a"/></marker>
<line x1="170" y1="150" x2="195" y2="150" stroke="#4a4d5a" stroke-width="1.8" marker-end="url(#m1)"/>
<marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#4a4d5a"/></marker>
<line x1="305" y1="150" x2="330" y2="150" stroke="#4a4d5a" stroke-width="1.8" marker-end="url(#m2)"/>
<text x="60" y="210" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">+ 各段独立优化、可观测、可换件</text>
<text x="60" y="232" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">- 三段延迟叠加 (通常 800-1500ms)</text>
<text x="60" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">- 情感/语调信息在文本层丢失</text>
<text x="60" y="285" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#3730a3" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">适合: 客服、工单等「内容优先」场景</text>
<rect x="490" y="70" width="420" height="250" rx="12" fill="#fafaf7" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="504" y="90" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">端到端 (Speech-to-Speech)</text>
<rect x="530" y="120" width="340" height="60" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="700.0" y="153.9" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">语音大模型 (音频 in → 音频 out)</text>
<text x="510" y="210" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">+ 感知副语言信息 (语气/情绪/打断意图)</text>
<text x="510" y="232" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">- 延迟更低 (300-600ms 可达)</text>
<text x="510" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">- 可观测性弱: 中间无文本, 调试与审计难</text>
<text x="510" y="285" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#3730a3" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">适合: 陪伴、面试、情感交互等「感觉优先」场景</text>
<text x="470" y="355" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#1c1e26" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">混合路线兴起: 端到端主干 + 文本旁路(日志/审计/工具调用) — 兼得感觉与可治理</text>
<text x="470" y="390" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#dc2626" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">延迟预算黄金线: 用户感知「对话自然」的往返延迟 &amp;lt; 1 秒 — 语音 Agent 的第一工程指标</text></svg>