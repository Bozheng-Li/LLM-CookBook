<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420"><defs></defs><rect width="920" height="420" fill="#ffffff"/><text x="460" y="30" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">心智模型:工作流是食谱,Agent 是厨师</text>
<rect x="60" y="80" width="380" height="200" rx="14" fill="#eaf0fe" stroke="#2563eb" stroke-width="1.4"/>
<text x="250" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" fill="#1e40af" font-weight="800" text-anchor="middle" style="">📋 工作流 Workflow = 食谱</text>
<text x="250" y="146.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">步骤 1: 热锅 → 步骤 2: 炒蛋 → 步骤 3: 下饭</text>
<text x="250" y="167.6" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">每一步由『食谱作者』预先决定,</text>
<text x="250" y="189.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">换食材(新需求)就要改食谱(改代码)。</text>
<text x="250" y="210.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">可预测、可复现,但僵硬。</text>
<rect x="480" y="80" width="380" height="200" rx="14" fill="#e7f6f4" stroke="#0d9488" stroke-width="1.4"/>
<text x="670" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" fill="#115e59" font-weight="800" text-anchor="middle" style="">👨‍🍳 Agent = 厨师</text>
<text x="670" y="146.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">目标是『一桌好菜』,步骤由厨师现场判断:</text>
<text x="670" y="167.6" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">鸡蛋不新鲜 → 换西红柿;</text>
<text x="670" y="189.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">客人赶时间 → 先上凉菜。</text>
<text x="670" y="210.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">灵活、能应对意外,但需要信任与验收。</text>
<marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#7a7d8c"/></marker>
<line x1="445" y1="180" x2="475" y2="180" stroke="#7a7d8c" stroke-width="1.6" marker-end="url(#m1)"/>
<rect x="60" y="300" width="800" height="90" rx="12" fill="#fafaf7" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="74" y="320" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">工程含义</text>
<text x="80" y="336" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#1c1e26" font-weight="400" text-anchor="start" style="">选食谱还是雇厨师,取决于任务的『意外密度』: 步骤固定且输入稳定 → 工作流;输入多变且需要判断 → Agent。</text>
<text x="80" y="364" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#1c1e26" font-weight="400" text-anchor="start" style="">大多数真实系统是混合体:外层工作流编排,内层若干个『厨师』处理不可预测的子任务(见第 14、24 章)。</text></svg>