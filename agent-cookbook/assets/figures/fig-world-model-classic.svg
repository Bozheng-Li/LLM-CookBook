<text x="780.0" y="183.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">z_t + 隐状态 h_t → 输出动作 a_t
极简小参数策略网络 (易进化)</text>
