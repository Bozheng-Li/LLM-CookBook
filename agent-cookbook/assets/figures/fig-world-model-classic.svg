<rect x="110" y="330" width="720" height="60" rx="8" fill="#fafaf7" stroke="#d2cec2" stroke-dasharray="6 4"/>
<text x="470" y="355" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#3730a3" font-weight="700" text-anchor="middle" style="">「在梦中训练」(Training in Dreams): 控制器 C 完全脱离真实环境，纯粹在记忆模型 M 虚拟的想象梦境中演化</text>
<text x="470" y="375" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">核心哲学: 感知(V)负责压缩现实，记忆(M)负责推演未来，决策(C)负责驾驭想象</text></svg>