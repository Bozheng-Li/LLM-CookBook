<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420"><defs></defs><rect width="940" height="420" fill="#ffffff"/><text x="470" y="32" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="18" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">World Models 经典三要素架构 (Ha &amp; Schmidhuber, 2018)</text>
