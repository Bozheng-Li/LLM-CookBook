<text x="160.0" y="183.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">观测数据 x_t → 隐空间 z_t
无监督感知表征压缩</text>
<rect x="370" y="110" width="200" height="120" rx="10" fill="#eef0fd" stroke="#4f46e5" stroke-width="1.4"/>
<text x="470.0" y="162.9" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">记忆模型 M (Memory / MDN-RNN)</text>
<text x="470.0" y="183.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">z_t + 动作 a_t → 预测 z_{t+1}
学习世界时空物理流转动力学</text>
