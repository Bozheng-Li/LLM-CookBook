<text x="470.0" y="335.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">• 随机博弈: S_t 下多智能体联合动作 a = (a_1, ..., a_N)，转移概率 P(s' | s, a_1, ..., a_N)</text>
<text x="470.0" y="353.5" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">• 纳什均衡 (Nash): 任意智能体在其他对手策略固定时，单方面偏离无法获得更高期望回报</text>
<text x="470.0" y="371.7" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">• 不完全信息扩展式博弈 (Extensive-form Game): 完美贝叶斯均衡与信念一致性更新</text></svg>