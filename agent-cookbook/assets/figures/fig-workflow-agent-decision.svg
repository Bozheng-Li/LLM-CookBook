<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520"><defs></defs><rect width="960" height="520" fill="#ffffff"/><text x="480" y="30" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">Workflow 还是 Agent：一条自上而下的决策链</text>
<text x="480" y="52" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">Anthropic 的原则：从最简单的方案开始，只有评测证明必要时才增加自主性</text>
<rect x="390" y="76" width="180" height="52" rx="10" fill="#f4f2ec" stroke="#d2cec2" stroke-width="1.4"/>
<text x="480.0" y="94.9" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">一个新任务</text>
<text x="480.0" y="115.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">先问下面三个问题</text>
<polygon points="480,148.0 630.0,190 480,232.0 330.0,190" fill="#fdf3e3" stroke="#d97706" stroke-width="1.4"/>
<text x="480" y="186.5" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#92400e" font-weight="700" text-anchor="middle" style="">Q1 · 任务的执行路径</text>
<text x="480" y="202.1" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#92400e" font-weight="700" text-anchor="middle" style="">能否预先写成固定流程？</text>
<marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#7a7d8c"/></marker>
<line x1="480.0" y1="128" x2="480.0" y2="148" stroke="#7a7d8c" stroke-width="1.8" marker-end="url(#m1)"/>
<rect x="60" y="150" width="220" height="72" rx="10" fill="#eaf0fe" stroke="#2563eb" stroke-width="1.4"/>
<text x="170.0" y="179.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#1e40af" font-weight="700" text-anchor="middle" style="">用 Workflow 就够</text>
<text x="170.0" y="199.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">链 / 路由 / 并行（第 6-8 章）
大多数业务流程的答案</text>
<marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#2563eb"/></marker>
<line x1="330" y1="190" x2="280" y2="190" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m2)"/>
<text x="305.0" y="182.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;">能</text>
<polygon points="480,278.0 630.0,320 480,362.0 330.0,320" fill="#fdf3e3" stroke="#d97706" stroke-width="1.4"/>
<text x="480" y="316.5" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#92400e" font-weight="700" text-anchor="middle" style="">Q2 · 失败动作能否低成本</text>
<text x="480" y="332.1" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#92400e" font-weight="700" text-anchor="middle" style="">验证或回滚？</text>
<marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#d97706"/></marker>
<line x1="480" y1="232" x2="480" y2="278" stroke="#d97706" stroke-width="1.6" marker-end="url(#m3)"/>
<text x="480.0" y="247.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#d97706" font-weight="600" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;">不能枚举</text>
<rect x="60" y="286" width="220" height="72" rx="10" fill="#fdeeee" stroke="#dc2626" stroke-width="1.4"/>
<text x="170.0" y="315.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#991b1b" font-weight="700" text-anchor="middle" style="">先加人工审批或缩小任务</text>
<text x="170.0" y="335.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">HITL 检查点（第 25 章）
把任务切成可验证的小块</text>
<marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#dc2626"/></marker>
<line x1="330" y1="320" x2="280" y2="320" stroke="#dc2626" stroke-width="1.6" marker-end="url(#m4)"/>
<text x="305.0" y="312.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#dc2626" font-weight="600" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;">否</text>
<polygon points="480,408.0 630.0,450 480,492.0 330.0,450" fill="#fdf3e3" stroke="#d97706" stroke-width="1.4"/>
<text x="480" y="446.5" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#92400e" font-weight="700" text-anchor="middle" style="">Q3 · 需要跨多步动态选工具</text>
<text x="480" y="462.1" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#92400e" font-weight="700" text-anchor="middle" style="">并利用中间结果吗？</text>
<marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#d97706"/></marker>
<line x1="480" y1="362" x2="480" y2="408" stroke="#d97706" stroke-width="1.6" marker-end="url(#m5)"/>
<text x="480.0" y="377.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#d97706" font-weight="600" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;">可验证/可回滚</text>
<rect x="760" y="286" width="176" height="72" rx="10" fill="#e7f6f4" stroke="#0d9488" stroke-width="1.4"/>
<text x="848.0" y="315.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#115e59" font-weight="700" text-anchor="middle" style="">单次工具调用即可</text>
<text x="848.0" y="335.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">结构化输出（第 8 章）
不必引入循环</text>
<marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#0d9488"/></marker>
<line x1="630" y1="320" x2="760" y2="320" stroke="#0d9488" stroke-width="1.6" marker-end="url(#m6)"/>
<text x="695.0" y="312.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#0d9488" font-weight="600" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;">只差一步</text>
<rect x="760" y="416" width="176" height="72" rx="10" fill="#eef0fd" stroke="#4f46e5" stroke-width="1.4"/>
<text x="848.0" y="445.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#3730a3" font-weight="700" text-anchor="middle" style="">上 Agent Loop</text>
<text x="848.0" y="465.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">模型驱动决策 + 环境闭环
三种刹车必配（第 15 章）</text>
<marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#4f46e5"/></marker>
<line x1="630" y1="450" x2="760" y2="452" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#m7)"/>
<text x="695.0" y="443.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4f46e5" font-weight="600" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;">是</text>
<text x="60" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">回看你的位置：绝大多数生产系统落在 Workflow 与「单次工具调用」两档；真正需要完整 Agent Loop 的，是路径无法枚举且可验证的任务。</text>
<text x="60" y="506" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">自主性每升一级，评测与护栏的投入至少翻一倍——这是成本，不是勋章。</text></svg>