<text x="470" y="315" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#dc2626" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">断点恢复机制: 从最近合法 Checkpoint 无损重建内存状态机，重放未确认动作，零重复消耗</text>
<text x="470" y="345" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#1c1e26" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">持久化契约: 包含 (Agent内部状态 + 环境快照ID + 外部API幂等凭证)，三者严格一致方可安全恢复</text></svg>