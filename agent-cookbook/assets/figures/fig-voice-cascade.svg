<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><defs></defs><rect width="960" height="400" fill="#ffffff"/><text x="480" y="30" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">语音 Agent 的两条技术路线</text>
<rect x="60" y="60" width="400" height="150" rx="12" fill="#fafaf7" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="74" y="80" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">级联式(传统,可控)</text>
<text x="80" y="98.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">ASR(语音→文本) → LLM → TTS(文本→语音)</text>
<text x="80" y="118.7" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">✓ 每环节可独立优化/替换  ✗ 级联延迟 800ms+</text>
<text x="80" y="139.4" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">✗ 丢失语气/情感/副语言信息</text>
<rect x="520" y="60" width="380" height="150" rx="12" fill="#fafaf7" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="534" y="80" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">端到端(新范式,拟人)</text>
<text x="540" y="98.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">语音直接进多模态模型 → 语音直接出</text>
<text x="540" y="118.7" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">✓ 延迟 300ms 内 · 可打断 · 情感丰富</text>
<text x="540" y="139.4" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4a4d5a" font-weight="400" text-anchor="start" style="">✗ 黑盒调优难 · 幻觉不可见(无文本中间态)</text>
<rect x="60" y="240" width="840" height="80" rx="12" fill="#eef0fd" stroke="#4f46e5"/>
<text x="480" y="268.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#3730a3" font-weight="600" text-anchor="middle" style="">电话/实时对话的延迟预算: 用户感知『即时』&lt; 500ms;打断(barge-in)与回声消除是工程生命线</text>
<text x="480" y="372" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">生产建议:客服等合规敏感场景用级联(要审计文本);陪伴/教练类体验优先端到端</text></svg>