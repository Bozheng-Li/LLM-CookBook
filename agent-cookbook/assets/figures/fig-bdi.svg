<text x="460" y="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="600" text-anchor="middle" style="">BDI 的现代启示:『意图』需要可撤销 —— 计划要能随信念更新而重审(对比 plan-execute 的 Replan)</text>
