<text x="80" y="250" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">产物分级: [已核实] 支持且可点开出处 · [单源] 只有一个来源 · [无据] 找不到出处 — 降级为「模型认为」</text>
<text x="80" y="276" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">成本控制: 核对只在「高风险主张」上做全量(数字/日期/专名/因果), 低风险主张批量抽检</text>
<text x="80" y="310" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#3730a3" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">与第57章Judge的分工: 核对流水线查「可验证一致性」(客观), Judge评「语义质量」(主观) — 勿混用</text></svg>