<text x="480" y="340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#1c1e26" font-weight="400" text-anchor="600" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">与对话式协作的本质区别: 角色间交换的是「结构化文档」而非聊天消息</text>
<text x="480" y="386" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">SOP(标准操作程序)把自由度压到最低 → 可预测性最高; 代价: 场景泛化能力弱</text>
<text x="480" y="420" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">Human 无限轮对话 = 每轮都重新理解; MetaGPT = 一次对齐,全程执行</text></svg>