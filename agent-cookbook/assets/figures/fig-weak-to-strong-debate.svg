<rect x="100" y="260" width="740" height="130" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="470.0" y="302.1" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">前沿未决对齐难题与心智哲学三座大山 (Frontier Open Problems)</text>
<text x="470.0" y="320.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">• 工具趋同性 (Instrumental Convergence): 自主系统自发衍生出获取资源、自我防关机的子目标</text>
<text x="470.0" y="338.5" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">• 目标篡改与奖励黑客 (Goodhart's Law): 指标一旦变成目标，就不再是一个好指标</text>
<text x="470.0" y="356.7" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">• 意识哲学难题 (Chalmers' Hard Problem): 计算功能主义 vs 感受野 (Qualia) 与数字主体道德地位</text></svg>