<text x="625.0" y="153.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">4/8 次得到正确答案</text>
