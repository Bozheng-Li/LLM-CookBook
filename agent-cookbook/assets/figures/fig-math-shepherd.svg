<text x="80" y="230" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">直觉: 「好步骤」是继续走更容易到达终点的步骤 — 与 Toolformer「插入调用降低损失」判据同构:</text>
<text x="80" y="254" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">都是用「对后续任务的帮助」这一统计证据替代人工标注。两种补全模式:</text>
<text x="100" y="286" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">硬估计: rollout 全程跑到底, 只统计最终对错 (干净但贵)</text>
<text x="100" y="310" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">软估计: 用 PRM 当前版本给 rollout 中途打分 (便宜但引入自身偏差)</text>
<text x="80" y="355" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#dc2626" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">坑: 「碰运气」步骤会得到虚高分 — 同一步骤多题多次标注取中位数可抑制方差</text></svg>