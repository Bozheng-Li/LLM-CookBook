<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380"><defs></defs><rect width="940" height="380" fill="#ffffff"/><text x="470" y="32" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="18" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">自主科研的能力边界:能自动化什么</text>
<rect x="60" y="250" width="820" height="80" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/>
<text x="470.0" y="295" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">已自动化 (现在): 文献综述 · 方案初稿 · 数据分析 · 图表生成 · 论文润色</text>
<rect x="60" y="155" width="820" height="80" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
<text x="470.0" y="200" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">人机协作 (临界): 假设生成(需人筛) · 实验执行(需人监) · 结论解读(需人判)</text>
<rect x="60" y="60" width="820" height="80" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<text x="470.0" y="105" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">仍是人类领地: 科学品味(什么问题值得问) · 范式判断 · 结果的意义赋予 · 责任归属</text>
<text x="470" y="355" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#3730a3" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">判据: 「可形式化且错误可检出」的环节自动化 — 科学品味与意义赋予不可形式化, 是科研的最后人类堡垒</text></svg>