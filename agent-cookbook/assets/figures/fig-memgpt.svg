<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400"><defs></defs><rect width="920" height="400" fill="#ffffff"/><text x="460" y="30" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">MemGPT:把 LLM 当操作系统,记忆分页换入换出</text>
<rect x="80" y="70" width="320" height="70" rx="10" fill="#eef0fd" stroke="#4f46e5" stroke-width="1.4"/>
<text x="240.0" y="97.9" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#3730a3" font-weight="700" text-anchor="middle" style="">主存(Main Context)</text>
<text x="240.0" y="118.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">提示词 + 对话历史(窗口内)</text>
<rect x="520" y="70" width="320" height="70" rx="10" fill="#e7f6f4" stroke="#0d9488" stroke-width="1.4"/>
<text x="680.0" y="97.9" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#115e59" font-weight="700" text-anchor="middle" style="">外存(External Storage)</text>
<text x="680.0" y="118.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">向量库 / 数据库 / 文件(窗口外)</text>
<marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#7a7d8c"/></marker>
<line x1="400" y1="92" x2="520" y2="92" stroke="#7a7d8c" stroke-width="1.8" marker-end="url(#m1)"/>
<text x="460.0" y="84.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="600" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;">页出: 满了就归档</text>
<marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#7a7d8c"/></marker>
<line x1="520" y1="118" x2="400" y2="118" stroke="#7a7d8c" stroke-width="1.8" marker-end="url(#m2)"/>
<text x="460.0" y="110.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="600" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;">页入: 需要时检索</text>
<rect x="80" y="180" width="760" height="150" rx="12" fill="#fafaf7" stroke="#d2cec2" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="94" y="200" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#7a7d8c" font-weight="700" text-anchor="start" style="">自我编辑的记忆指令(self-editing memory)</text>
<text x="100" y="220.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#1c1e26" font-weight="400" text-anchor="start" style="">模型自己决定何时调用 memory_replace(&quot;user.pref&quot;, &quot;不喜欢太技术的解释&quot;) —— 就像操作系统的 mmap/换页,</text>
<text x="100" y="244.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#1c1e26" font-weight="400" text-anchor="start" style="">把「记住什么、忘记什么」的决策权交给模型本身,而不是靠外置启发式规则。</text>
<rect x="237.67999999999995" y="308.0" width="444.6400000000001" height="24" rx="12.0" fill="#fdf3e3" stroke="none"/>
<text x="460" y="324.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#92400e" font-weight="700" text-anchor="middle" style="">这一思想直接演化为 Claude 的 memory tool 与 Letta 的 MemGPT 服务器</text>
<text x="460" y="380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">Packer et al., 2023 «MemGPT: Towards LLMs as Operating Systems»</text></svg>