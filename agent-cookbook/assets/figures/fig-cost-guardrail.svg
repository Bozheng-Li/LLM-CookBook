<text x="40" y="372" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">三层护栏各管一层：单次调用上限（max_tokens）→ 任务预算（一个 Agent 会话的花费上限）→ 全局预算（按用户/按天的熔断线）。</text>
<text x="40" y="396" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#4a4d5a" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">省钱顺序：缓存命中 → 缩上下文 → 换小模型 → 批处理半价 → 级联路由；组合拳可把成本压低一个量级。</text></svg>