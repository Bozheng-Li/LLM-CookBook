<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><defs></defs><rect width="960" height="430" fill="#ffffff"/><text x="480" y="30" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">成本核算与预算护栏：先记账，再谈省钱</text>
<text x="480" y="52" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">usage 是唯一事实来源：每次调用的输入/输出 token 都要落账，护栏才有依据</text>
