<text x="324.0" y="139.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">读取 usage：prompt / completion</text>
