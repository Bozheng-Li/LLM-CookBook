<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"><defs></defs><rect width="900" height="460" fill="#ffffff"/><text x="450" y="32" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">元提示:让 LLM 批判并改写提示词的优化循环</text>
