<text x="450" y="388" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">APE(Zhou et al. 2022)、OPRO(Yang et al. 2023)与 DSPy 都是这个循环的工程化实现</text>
<text x="450" y="414" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">前提:评测集必须能自动判分 —— 没有可靠分数,优化的是噪声而不是提示词</text>
<text x="450" y="440" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">每轮成本 = N 次评测调用 + 1 次改写调用;通常 3~5 轮内收敛,之后收益递减</text></svg>