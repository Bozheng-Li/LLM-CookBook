<text x="508" y="143.4" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#1c1e26" font-weight="400" text-anchor="start" style="">工作记录,给我写一份周报:</text>
