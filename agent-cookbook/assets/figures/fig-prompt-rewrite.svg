<text x="460" y="476" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">仍不确定时,先让模型反问你 —— 它会告诉你它缺什么信息</text></svg>