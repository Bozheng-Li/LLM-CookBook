<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380"><defs></defs><rect width="940" height="380" fill="#ffffff"/><text x="470" y="32" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="18" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">显式生成式世界模型 vs 隐式潜在空间模型 (Latent Dynamics)</text>
<rect x="60" y="100" width="380" height="220" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/>
<text x="250.0" y="214.4" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">显式生成式 (如 Sora / Genie / Video-WM)</text>
<text x="250" y="130" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" fill="#0d9488" font-weight="800" text-anchor="middle" style="">显式生成式 (如 Sora / Genie)</text>
<text x="250" y="165" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">· 形式: 像素级视频预测 (Pixel-level Diffusion)</text>
<text x="250" y="187" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">· 优点: 人类直观可解释，保真度极高，通用泛化强</text>
<text x="250" y="209" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">· 缺点: 推理算力极其昂贵，像素渲染充满视觉冗余</text>
<text x="250" y="231" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">· 适用: 仿真数据自合成、交互式虚拟环境生成</text>
<rect x="500" y="100" width="380" height="220" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="690.0" y="214.4" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">隐式潜在模型 (如 DreamerV3 / MuZero / JEPA)</text>
<text x="690" y="130" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" fill="#4f46e5" font-weight="800" text-anchor="middle" style="">隐式潜在模型 (如 DreamerV3 / JEPA)</text>
<text x="690" y="165" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">· 形式: 任务相关的隐空间状态转移 (Latent Transitions)</text>
<text x="690" y="187" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">· 优点: 零像素生成开销，直击任务因果核心，极速秒级前瞻</text>
<text x="690" y="209" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">· 缺点: 内部向量不可直视，极易发生隐空间坍塌与漂移</text>
<text x="690" y="231" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">· 适用: 复杂物理控制、前瞻式深度搜索规划 (MCTS)</text>
<text x="470" y="350" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#3730a3" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">趋同共识: 规划需要隐式极速推演(Dreamer范式)，数据与可解释性需要显式逼真生成(Genie范式)，两者正走向分工融合</text></svg>