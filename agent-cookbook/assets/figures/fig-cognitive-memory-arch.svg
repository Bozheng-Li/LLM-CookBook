<text x="470.0" y="330.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">• 艾宾浩斯遗忘曲线 (Ebbinghaus): 记忆强度随时间指数衰减 R = e^(-t/S)，需周期性间隔复述刷新</text>
