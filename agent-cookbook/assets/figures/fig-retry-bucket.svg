<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><defs></defs><rect width="960" height="470" fill="#ffffff"/><text x="480" y="30" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">重试与限流：一对互补的机制</text>
<text x="480" y="52" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">限流在「发出之前」本地排队，退避在「被打回之后」再试——前者防雪崩，后者保恢复</text>
<rect x="28" y="72" width="452" height="286" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="42" y="92" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#3730a3" font-weight="700" text-anchor="start" style="">指数退避 + 抖动（收到 429 / 5xx 之后）</text>
<marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#7a7d8c"/></marker>
<polyline points="60,300 450,300" fill="none" stroke="#7a7d8c" stroke-width="1.6" marker-end="url(#m1)"/>
<circle cx="78" cy="300" r="7" fill="#dc2626"/>
<text x="78" y="324" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">尝试 1</text>
<circle cx="128" cy="300" r="7" fill="#dc2626"/>
<text x="128" y="324" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">尝试 2</text>
<circle cx="200" cy="300" r="7" fill="#dc2626"/>
<text x="200" y="324" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">尝试 3</text>
<circle cx="306" cy="300" r="7" fill="#d97706"/>
<text x="306" y="324" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">尝试 4</text>
<circle cx="428" cy="300" r="7" fill="#f4f2ec"/>
<text x="428" y="324" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">放弃/降级</text>
<marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#4f46e5"/></marker>
<line x1="86" y1="300" x2="120" y2="300" stroke="#4f46e5" stroke-width="1.4" marker-end="url(#m2)"/>
<text x="103.0" y="284" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#3730a3" font-weight="700" text-anchor="middle" style="">等 1s</text>
<marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#4f46e5"/></marker>
<line x1="136" y1="300" x2="192" y2="300" stroke="#4f46e5" stroke-width="1.4" marker-end="url(#m3)"/>
<text x="164.0" y="284" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#3730a3" font-weight="700" text-anchor="middle" style="">等 2s</text>
<marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#4f46e5"/></marker>
<line x1="208" y1="300" x2="298" y2="300" stroke="#4f46e5" stroke-width="1.4" marker-end="url(#m4)"/>
<text x="253.0" y="284" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#3730a3" font-weight="700" text-anchor="middle" style="">等 4s</text>
<marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#4f46e5"/></marker>
<line x1="314" y1="300" x2="420" y2="300" stroke="#4f46e5" stroke-width="1.4" marker-end="url(#m5)"/>
<text x="367.0" y="284" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#3730a3" font-weight="700" text-anchor="middle" style="">等 8s</text>
<text x="78" y="262" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="start" style="">间隔 ×2 指数拉长，抖动防止同步重试</text>
<rect x="48" y="344" width="200" height="56" rx="10" fill="#eef0fd" stroke="#4f46e5" stroke-width="1.4"/>
<text x="148.0" y="365.4" font-family="'Cascadia Code',Consolas,monospace" font-size="12.5" fill="#3730a3" font-weight="700" text-anchor="middle" style="">等待时间公式</text>
<text x="148.0" y="384.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">min(cap, base*2^n) * U(0.5,1.5)</text>
<rect x="264" y="344" width="196" height="56" rx="10" fill="#e7f6f4" stroke="#0d9488" stroke-width="1.4"/>
<text x="362.0" y="365.7" font-family="'Cascadia Code',Consolas,monospace" font-size="12" fill="#115e59" font-weight="700" text-anchor="middle" style="">只重试可重试错误</text>
<text x="362.0" y="384.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">429/500/502/503/超时</text>
<rect x="508" y="72" width="424" height="286" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="522" y="92" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#115e59" font-weight="700" text-anchor="start" style="">客户端令牌桶（发出请求之前）</text>
<path d="M535.0,138.0 a65.0,10 0 0 1 130,0 v114 a65.0,10 0 0 1 -130,0 z" fill="#e7f6f4" stroke="#0d9488" stroke-width="1.4"/>
<ellipse cx="600" cy="138.0" rx="65.0" ry="10" fill="none" stroke="#0d9488" stroke-width="1.4"/>
<text x="600" y="200.5" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#115e59" font-weight="700" text-anchor="middle" style=""></text>
<circle cx="572" cy="172" r="7.5" fill="#0d9488"/>
<circle cx="604" cy="182" r="7.5" fill="#0d9488"/>
<circle cx="628" cy="162" r="7.5" fill="#0d9488"/>
<circle cx="586" cy="208" r="7.5" fill="#0d9488"/>
<circle cx="620" cy="200" r="7.5" fill="#0d9488"/>
<circle cx="598" cy="230" r="7.5" fill="#0d9488"/>
<text x="600" y="282" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#115e59" font-weight="700" text-anchor="middle" style="">桶深 b：突发容量</text>
<marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#2563eb"/></marker>
<line x1="512" y1="122" x2="548" y2="152" stroke="#2563eb" stroke-width="1.6" marker-end="url(#m6)"/>
<text x="530.0" y="129.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;">以 r 枚/秒匀速注入</text>
<text x="512" y="108" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="start" style="">（对齐 RPM / TPM 配额）</text>
<marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.6 L9.5,5 L0,9.4 z" fill="#4f46e5"/></marker>
<line x1="700" y1="200" x2="862" y2="200" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#m7)"/>
<text x="781.0" y="192.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#4f46e5" font-weight="600" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;">请求先取 1 枚</text>
<text x="786" y="176" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">（按成本加权取 n 枚）</text>
<rect x="700" y="240" width="214" height="52" rx="10" fill="#fdf3e3" stroke="#d97706" stroke-width="1.4"/>
<text x="807.0" y="259.4" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#92400e" font-weight="700" text-anchor="middle" style="">桶空 → 本地排队</text>
<text x="807.0" y="278.8" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">而不是把 429 打到服务端</text>
<text x="706" y="318" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">平均速率 = r，突发容忍 = b</text>
<rect x="28" y="376" width="904" height="56" rx="10" fill="#f4f2ec" stroke="#d2cec2" stroke-width="1.4"/>
<text x="480.0" y="397.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#1c1e26" font-weight="600" text-anchor="middle" style="">一句结论：退避负责「失败后的礼貌」，限流负责「失败前的自觉」——两者都做在客户端</text>
<text x="480.0" y="417.3" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="">重试不加抖动 = 定时轰炸；限流不留突发 = 吞吐白丢。务必在压测里同时验证两条路径。</text></svg>