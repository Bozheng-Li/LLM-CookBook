<text x="100" y="376" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#3730a3" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">部署要点: 拦截必须在网络层 (进程逃逸也出不去) — 应用层的「自律式过滤」只防君子</text></svg>