<text x="100" y="320" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#1c1e26" font-weight="400" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">三层过滤按成本递增: 域名白名单 (零误报, 必配) → 内容嗅探 (DLP 规则, 拦「白名单内但带敏感数据」) →</text>
