<text x="780" y="362.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#1c1e26" font-weight="600" text-anchor="middle" style="">Action：search[B] → 观察</text>
