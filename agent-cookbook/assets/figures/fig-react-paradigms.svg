<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520"><defs></defs><rect width="960" height="520" fill="#ffffff"/><text x="480" y="30" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="17.5" fill="#1c1e26" font-weight="800" text-anchor="middle" style="">三种范式：CoT 只有脑，Act-only 只有手，ReAct 脑手交织</text>
