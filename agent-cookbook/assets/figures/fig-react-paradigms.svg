<text x="480" y="338.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#4a4d5a" font-weight="400" text-anchor="middle" style="">❌ 盲走，错一步难回头</text>
