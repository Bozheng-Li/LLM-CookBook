<text x="480" y="494.5" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" fill="#92400e" font-weight="700" text-anchor="middle" style="">交织 = 每次行动前先声明理由，每次行动后用真实观察校准推理 —— Yao et al., ICLR 2023</text></svg>