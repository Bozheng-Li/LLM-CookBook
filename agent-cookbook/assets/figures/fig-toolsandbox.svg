<text x="470" y="240" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#1c1e26" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">三种考法的共同点: 判分器跟踪「世界状态」— 上一轮的调用改变了什么, 下一轮的断言就用什么</text>
<text x="470" y="268" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#7a7d8c" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">与静态评测(每题独立)的本质区别: 状态在轮间流动, 分数 = 状态跟踪能力</text>
<text x="470" y="320" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.5" fill="#3730a3" font-weight="400" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px;">工程启示: 多轮业务 Agent 的评测必须含「隐式指代」与「中途变卦」两类题 — 最常见的线上翻车形态</text></svg>