<text x="760.0" y="139.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">③ 动态策略</text>
<text x="760" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">任务中途规则变化</text>
<text x="760" y="130" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">(「现在免费改签了」)</text>
<text x="760" y="148" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">→ 考策略的实时更新</text>
