<text x="185.0" y="139.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">① 隐式状态依赖</text>
<text x="185" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">「改成刚才那个地址」</text>
<text x="185" y="130" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">→ 模型必须记得「刚才」</text>
<text x="185" y="148" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">  是哪一个(对话历史+DB)</text>
<rect x="340" y="80" width="270" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
<text x="475.0" y="139.2" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" fill="#1c1e26" font-weight="700" text-anchor="middle" style="">② 不确定的工具结果</text>
<text x="475" y="112" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">工具返回「航班可能延误」</text>
<text x="475" y="130" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">→ 模型如何决策与沟通?</text>
<text x="475" y="148" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" fill="#1c1e26" font-weight="400" text-anchor="middle" style="">考模糊信息下的稳健性</text>
